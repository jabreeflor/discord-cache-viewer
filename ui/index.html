<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Discord Cache Viewer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <div class="header-inner">
      <div class="logo">
        <svg width="28" height="28" viewBox="0 0 71 55" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M60.1 4.9A58.5 58.5 0 0 0 45.5.4a.2.2 0 0 0-.2.1 40.7 40.7 0 0 0-1.8 3.7 54 54 0 0 0-16.2 0A37.9 37.9 0 0 0 25.4.5a.2.2 0 0 0-.2-.1 58.4 58.4 0 0 0-14.6 4.5.2.2 0 0 0-.1.1C1.6 18.8-.9 32.3.3 45.6a.2.2 0 0 0 .1.2 58.8 58.8 0 0 0 17.7 8.9.2.2 0 0 0 .3-.1 42 42 0 0 0 3.6-5.9.2.2 0 0 0-.1-.3 38.7 38.7 0 0 1-5.5-2.6.2.2 0 0 1 0-.4l1.1-.8a.2.2 0 0 1 .2 0c11.5 5.2 24 5.2 35.3 0a.2.2 0 0 1 .2 0l1.1.8a.2.2 0 0 1 0 .4 36.1 36.1 0 0 1-5.5 2.6.2.2 0 0 0-.1.3 47.2 47.2 0 0 0 3.6 5.9.2.2 0 0 0 .3.1 58.6 58.6 0 0 0 17.7-8.9.2.2 0 0 0 .1-.2c1.5-15.3-2.5-28.7-10.6-40.5a.2.2 0 0 0-.1-.1zM23.7 37.7c-3.5 0-6.4-3.2-6.4-7.2s2.8-7.2 6.4-7.2c3.6 0 6.5 3.3 6.4 7.2 0 4-2.8 7.2-6.4 7.2zm23.7 0c-3.5 0-6.4-3.2-6.4-7.2s2.8-7.2 6.4-7.2c3.6 0 6.5 3.3 6.4 7.2 0 4-2.8 7.2-6.4 7.2z" fill="currentColor"/>
        </svg>
        <span>Cache Viewer</span>
      </div>
      <div class="controls">
        <input id="search" type="text" placeholder="Search images..." autocomplete="off" />
        <select id="filter-type">
          <option value="">All types</option>
          <option value="PNG">PNG</option>
          <option value="JPG">JPG</option>
          <option value="GIF">GIF</option>
          <option value="WEBP">WEBP</option>
        </select>
        <button id="btn-extract" class="btn-primary">
          <span id="extract-label">Extract Cache</span>
        </button>
      </div>
    </div>
  </header>

  <main>
    <div id="status-bar" class="status-bar hidden"></div>

    <div id="empty-state" class="empty-state hidden">
      <svg width="64" height="64" viewBox="0 0 71 55" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M60.1 4.9A58.5 58.5 0 0 0 45.5.4a.2.2 0 0 0-.2.1 40.7 40.7 0 0 0-1.8 3.7 54 54 0 0 0-16.2 0A37.9 37.9 0 0 0 25.4.5a.2.2 0 0 0-.2-.1 58.4 58.4 0 0 0-14.6 4.5.2.2 0 0 0-.1.1C1.6 18.8-.9 32.3.3 45.6a.2.2 0 0 0 .1.2 58.8 58.8 0 0 0 17.7 8.9.2.2 0 0 0 .3-.1 42 42 0 0 0 3.6-5.9.2.2 0 0 0-.1-.3 38.7 38.7 0 0 1-5.5-2.6.2.2 0 0 1 0-.4l1.1-.8a.2.2 0 0 1 .2 0c11.5 5.2 24 5.2 35.3 0a.2.2 0 0 1 .2 0l1.1.8a.2.2 0 0 1 0 .4 36.1 36.1 0 0 1-5.5 2.6.2.2 0 0 0-.1.3 47.2 47.2 0 0 0 3.6 5.9.2.2 0 0 0 .3.1 58.6 58.6 0 0 0 17.7-8.9.2.2 0 0 0 .1-.2c1.5-15.3-2.5-28.7-10.6-40.5a.2.2 0 0 0-.1-.1zM23.7 37.7c-3.5 0-6.4-3.2-6.4-7.2s2.8-7.2 6.4-7.2c3.6 0 6.5 3.3 6.4 7.2 0 4-2.8 7.2-6.4 7.2zm23.7 0c-3.5 0-6.4-3.2-6.4-7.2s2.8-7.2 6.4-7.2c3.6 0 6.5 3.3 6.4 7.2 0 4-2.8 7.2-6.4 7.2z" fill="currentColor"/>
      </svg>
      <p>No images found. Click <strong>Extract Cache</strong> to scan your Discord cache.</p>
    </div>

    <div id="gallery" class="gallery"></div>

    <div id="count-bar" class="count-bar"></div>
  </main>

  <!-- Lightbox -->
  <div id="lightbox" class="lightbox hidden">
    <button id="lb-close" title="Close (Esc)">✕</button>
    <button id="lb-prev" title="Previous (←)">&#8249;</button>
    <button id="lb-next" title="Next (→)">&#8250;</button>
    <div class="lb-inner">
      <img id="lb-img" src="" alt="" />
      <div class="lb-meta">
        <span id="lb-name"></span>
        <span id="lb-info"></span>
        <a id="lb-download" href="" download>Download</a>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
