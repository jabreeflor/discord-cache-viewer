<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 180" width="900" height="180">
  <defs>
    <!-- Backgrounds -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e1f22"/>
      <stop offset="100%" stop-color="#2b2d31"/>
    </linearGradient>
    <!-- Accent stripe -->
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5865f2"/>
      <stop offset="100%" stop-color="#7289da"/>
    </linearGradient>
    <!-- Gallery fade-in from left -->
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#2b2d31" stop-opacity="1"/>
      <stop offset="100%" stop-color="#2b2d31" stop-opacity="0"/>
    </linearGradient>
    <!-- Gallery card fills -->
    <linearGradient id="c1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#5865f2"/><stop offset="100%" stop-color="#3b4dbf"/></linearGradient>
    <linearGradient id="c2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#23a55a"/><stop offset="100%" stop-color="#1a7a42"/></linearGradient>
    <linearGradient id="c3" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ed4245"/><stop offset="100%" stop-color="#a32d30"/></linearGradient>
    <linearGradient id="c4" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#faa61a"/><stop offset="100%" stop-color="#b87010"/></linearGradient>
    <linearGradient id="c5" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#7289da"/><stop offset="100%" stop-color="#4e5eb8"/></linearGradient>
    <linearGradient id="c6" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#43b581"/><stop offset="100%" stop-color="#2a7a55"/></linearGradient>
    <linearGradient id="c7" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#eb459e"/><stop offset="100%" stop-color="#a82e6e"/></linearGradient>
    <linearGradient id="c8" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ff7f50"/><stop offset="100%" stop-color="#b84a28"/></linearGradient>
    <linearGradient id="c9" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#4fc3f7"/><stop offset="100%" stop-color="#0277bd"/></linearGradient>
    <!-- Glow filter for logo -->
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="16" result="blur"/>
    </filter>
    <!-- Clip to rounded rect -->
    <clipPath id="bounds">
      <rect width="900" height="180" rx="12"/>
    </clipPath>
  </defs>

  <g clip-path="url(#bounds)">
    <!-- Base background -->
    <rect width="900" height="180" fill="url(#bg)"/>

    <!-- Blurple glow behind logo -->
    <circle cx="82" cy="90" r="48" fill="#5865f2" opacity="0.28" filter="url(#glow)"/>

    <!-- 3×3 gallery card grid (right side) -->
    <!-- row 1  y=17 -->
    <rect x="672" y="17"  width="66" height="44" rx="6" fill="url(#c1)"/>
    <rect x="745" y="17"  width="66" height="44" rx="6" fill="url(#c2)"/>
    <rect x="818" y="17"  width="66" height="44" rx="6" fill="url(#c3)"/>
    <!-- row 2  y=68 -->
    <rect x="672" y="68"  width="66" height="44" rx="6" fill="url(#c4)"/>
    <rect x="745" y="68"  width="66" height="44" rx="6" fill="url(#c5)"/>
    <rect x="818" y="68"  width="66" height="44" rx="6" fill="url(#c6)"/>
    <!-- row 3  y=119 -->
    <rect x="672" y="119" width="66" height="44" rx="6" fill="url(#c7)"/>
    <rect x="745" y="119" width="66" height="44" rx="6" fill="url(#c8)"/>
    <rect x="818" y="119" width="66" height="44" rx="6" fill="url(#c9)"/>

    <!-- Subtle image details — sun circle + ground band per card -->
    <!-- row 1 -->
    <circle cx="726" cy="28"  r="7" fill="rgba(255,255,255,0.18)"/><rect x="672" y="49"  width="66" height="12" fill="rgba(0,0,0,0.18)"/>
    <circle cx="799" cy="28"  r="7" fill="rgba(255,255,255,0.18)"/><rect x="745" y="49"  width="66" height="12" fill="rgba(0,0,0,0.18)"/>
    <circle cx="872" cy="28"  r="7" fill="rgba(255,255,255,0.18)"/><rect x="818" y="49"  width="66" height="12" fill="rgba(0,0,0,0.18)"/>
    <!-- row 2 -->
    <circle cx="726" cy="79"  r="7" fill="rgba(255,255,255,0.18)"/><rect x="672" y="100" width="66" height="12" fill="rgba(0,0,0,0.18)"/>
    <circle cx="799" cy="79"  r="7" fill="rgba(255,255,255,0.18)"/><rect x="745" y="100" width="66" height="12" fill="rgba(0,0,0,0.18)"/>
    <circle cx="872" cy="79"  r="7" fill="rgba(255,255,255,0.18)"/><rect x="818" y="100" width="66" height="12" fill="rgba(0,0,0,0.18)"/>
    <!-- row 3 -->
    <circle cx="726" cy="130" r="7" fill="rgba(255,255,255,0.18)"/><rect x="672" y="151" width="66" height="12" fill="rgba(0,0,0,0.18)"/>
    <circle cx="799" cy="130" r="7" fill="rgba(255,255,255,0.18)"/><rect x="745" y="151" width="66" height="12" fill="rgba(0,0,0,0.18)"/>
    <circle cx="872" cy="130" r="7" fill="rgba(255,255,255,0.18)"/><rect x="818" y="151" width="66" height="12" fill="rgba(0,0,0,0.18)"/>

    <!-- Fade overlay: blends gallery into background from left -->
    <rect x="590" y="0" width="310" height="180" fill="url(#fade)"/>

    <!-- Top accent stripe -->
    <rect x="0" y="0" width="900" height="4" fill="url(#acc)"/>

    <!-- Discord logo: viewBox 71×55 → scaled 0.92, centered at (82, 90) -->
    <!-- translate: (82 − 71×0.92/2, 90 − 55×0.92/2) = (49.4, 64.7) -->
    <g transform="translate(49.4, 64.7) scale(0.92)">
      <path fill="#5865f2" d="M60.1 4.9A58.5 58.5 0 0 0 45.5.4a.2.2 0 0 0-.2.1 40.7 40.7 0 0 0-1.8 3.7 54 54 0 0 0-16.2 0A37.9 37.9 0 0 0 25.4.5a.2.2 0 0 0-.2-.1 58.4 58.4 0 0 0-14.6 4.5.2.2 0 0 0-.1.1C1.6 18.8-.9 32.3.3 45.6a.2.2 0 0 0 .1.2 58.8 58.8 0 0 0 17.7 8.9.2.2 0 0 0 .3-.1 42 42 0 0 0 3.6-5.9.2.2 0 0 0-.1-.3 38.7 38.7 0 0 1-5.5-2.6.2.2 0 0 1 0-.4l1.1-.8a.2.2 0 0 1 .2 0c11.5 5.2 24 5.2 35.3 0a.2.2 0 0 1 .2 0l1.1.8a.2.2 0 0 1 0 .4 36.1 36.1 0 0 1-5.5 2.6.2.2 0 0 0-.1.3 47.2 47.2 0 0 0 3.6 5.9.2.2 0 0 0 .3.1 58.6 58.6 0 0 0 17.7-8.9.2.2 0 0 0 .1-.2c1.5-15.3-2.5-28.7-10.6-40.5a.2.2 0 0 0-.1-.1zM23.7 37.7c-3.5 0-6.4-3.2-6.4-7.2s2.8-7.2 6.4-7.2c3.6 0 6.5 3.3 6.4 7.2 0 4-2.8 7.2-6.4 7.2zm23.7 0c-3.5 0-6.4-3.2-6.4-7.2s2.8-7.2 6.4-7.2c3.6 0 6.5 3.3 6.4 7.2 0 4-2.8 7.2-6.4 7.2z"/>
    </g>

    <!-- Vertical divider -->
    <line x1="143" y1="28" x2="143" y2="152" stroke="#3f4147" stroke-width="1"/>

    <!-- Title -->
    <text x="163" y="82" fill="#f2f3f5"
          font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
          font-size="28" font-weight="700" letter-spacing="-0.4">Discord Cache Viewer</text>

    <!-- Subtitle -->
    <text x="163" y="107" fill="#b5bac1"
          font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
          font-size="13.5">Browse your Discord image cache in a local, Discord-styled gallery</text>

    <!-- Feature pills -->
    <rect x="163" y="124" width="72" height="22" rx="11" fill="#313338" stroke="#3f4147" stroke-width="1"/>
    <text x="199" y="139" fill="#b5bac1" text-anchor="middle"
          font-family="system-ui,sans-serif" font-size="11" font-weight="500">Python 3</text>

    <rect x="243" y="124" width="70" height="22" rx="11" fill="#313338" stroke="#3f4147" stroke-width="1"/>
    <text x="278" y="139" fill="#b5bac1" text-anchor="middle"
          font-family="system-ui,sans-serif" font-size="11" font-weight="500">Windows</text>

    <rect x="321" y="124" width="82" height="22" rx="11" fill="#313338" stroke="#3f4147" stroke-width="1"/>
    <text x="362" y="139" fill="#b5bac1" text-anchor="middle"
          font-family="system-ui,sans-serif" font-size="11" font-weight="500">Zero deps</text>

    <rect x="411" y="124" width="62" height="22" rx="11" fill="#23a55a"/>
    <text x="442" y="139" fill="#ffffff" text-anchor="middle"
          font-family="system-ui,sans-serif" font-size="11" font-weight="600">Public</text>

    <rect x="481" y="124" width="92" height="22" rx="11" fill="#faa61a"/>
    <text x="527" y="139" fill="#1e1f22" text-anchor="middle"
          font-family="system-ui,sans-serif" font-size="11" font-weight="700">Unofficial</text>
  </g>

  <!-- Outer border drawn on top of clip -->
  <rect width="900" height="180" fill="none" stroke="#3f4147" stroke-width="1" rx="12"/>
</svg>
